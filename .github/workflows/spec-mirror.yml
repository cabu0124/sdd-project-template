# A spec mirrored from the Spec Repository is read-only, and spec.link.yml records
# a sha256 for every file that was copied. This recomputes them, so a mirror edited
# here fails the pull request instead of quietly giving this repository its own
# version of what was agreed. See docs/spec-repo.md.
#
# The digest comes from scripts/spec-hash.sh — the same script /sdd-sync uses to
# write it. One implementation, or this job fails on how somebody's machine took
# the hash rather than on what the file says.
name: Spec mirror

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  spec-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every mirrored spec against its recorded hashes and source
        run: bash scripts/sdd-check.sh
