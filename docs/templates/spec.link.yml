# Which spec this directory implements. Written by scripts/spec-sync.sh — do not
# edit by hand. This file documents the shape; the script fills it.
#
# There is no copy of the spec here, and that is the point: it is read from the
# Spec Repository at `ref`, so this repository cannot hold a second version of
# what was agreed. This file only says which spec, and where to find it.
#
# `source.commit` is the revision last reviewed here. It is not what gets read —
# reads follow `ref` — it is what /sdd-sync diffs against to tell you that a
# requirement moved since plan.md and tasks.md were written.

spec_repo: <spec-repo>            # `spec_repo.name` from .sdd/config.yml

source:
  id: <NNN-slug>                  # as the Spec Repository numbers it
  path: <specs_dir>/<NNN-slug>
  ref: <branch or tag>
  commit: <full sha of that ref when it was last reviewed here>
  status: <draft | review | approved | done | superseded>   # upstream, at sync time

synced:
  at: <YYYY-MM-DD>
  local_id: <NNN-slug>            # this repository's own number for it
