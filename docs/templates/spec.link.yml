# Provenance of the mirrored spec. Written by /sdd-sync — do not edit by hand.
# The spec beside this file is a verbatim copy: it is owned by the Spec
# Repository, and changing it here is what this file exists to detect.
#
# The hashes below come from `scripts/spec-hash.sh <this directory>`, which
# prints the whole `files:` block. Compute them any other way and they will
# disagree with the way they are read back, on somebody else's machine.

spec_repo: <spec-repo>            # `spec_repo.name` from .sdd/config.yml

source:
  id: <NNN-slug>                  # as the Spec Repository numbers it
  path: <specs_dir>/<NNN-slug>
  ref: <branch or tag>
  commit: <full sha of that ref at sync time>
  status: <draft | review | approved | done | superseded>   # upstream, at sync time

synced:
  at: <YYYY-MM-DD>
  local_id: <NNN-slug>            # this repository's own number for it

files:                            # sha256 of each mirrored file, as copied
  spec.md: <sha256>
  wireframe.html: <sha256>        # delete the line when there is none
