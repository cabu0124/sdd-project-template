# What this template owns, and how `scripts/sdd-upgrade.sh` may touch each file
# in a repository built from it.
#
# Three classes, and the difference is the whole design:
#
#   managed  The template's own. An upgrade overwrites them, unless the
#            repository edited them — .sdd/template.lock is what tells the two
#            apart. A local edit is reported and left alone, never merged.
#
#   seeded   Delivered once, then the repository's. An upgrade never rewrites
#            them; it only refreshes the marked blocks listed under `blocks:`.
#            This is where the project lives, and the project is not ours.
#
#   ignored  Never touched, never reported. Specs, skills a repository wrote
#            for itself, its licence, its own changelog.
#
# Every versioned file is in exactly one of the three, and
# scripts/test-sdd-upgrade.sh fails when one is in none — otherwise a file added
# to the template years from now silently stops reaching anybody.
#
# Lists are explicit rather than globbed on purpose. A glob decides the class of
# files nobody has written yet; this way, adding a file is a decision.

managed:
  - .gitattributes
  - .gitignore
  - .github/workflows/link-check.yml
  - .github/workflows/pr-title.yml
  - .github/workflows/release.yml
  - .github/workflows/spec-pointer.yml
  - .sdd/manifest.yml
  - docs/agents/.gitkeep
  - docs/agents/code-surveyor.md
  - docs/agents/spec-explorer.md
  - docs/agents/wireframe-artist.md
  - docs/commands/adopt.md
  - docs/commands/analyze.md
  - docs/commands/clarify.md
  - docs/commands/implement.md
  - docs/commands/init.md
  - docs/commands/onboard.md
  - docs/commands/plan.md
  - docs/commands/preflight.md
  - docs/commands/specify.md
  - docs/commands/sync.md
  - docs/commands/tasks.md
  - docs/commands/upgrade.md
  - docs/delivery.md
  - docs/example.md
  - docs/skills/.gitkeep
  - docs/skills/delegating-exploration/SKILL.md
  - docs/skills/reading-condensed-output/SKILL.md
  - docs/spec-repo.md
  - docs/standards/.gitkeep
  - docs/templates/agent.md
  - docs/templates/cross-repo.md
  - docs/templates/plan.md
  - docs/templates/readme.md
  - docs/templates/skill.md
  - docs/templates/spec.link.yml
  - docs/templates/spec.md
  - docs/templates/standard.md
  - docs/templates/tasks.md
  - docs/token-budget.md
  - scripts/sdd-check.sh
  - scripts/sdd-compact.sh
  - scripts/sdd-doctor.sh
  - scripts/sdd-hook.sh
  - scripts/sdd-lib.sh
  - scripts/sdd-onboard.sh
  - scripts/sdd-preflight.sh
  - scripts/sdd-recall.sh
  - scripts/sdd-upgrade.sh
  - scripts/spec-check.sh
  - scripts/spec-pointer-check.sh
  - scripts/spec-sync.sh
  - scripts/spec-wireframe.sh
  - scripts/test-sdd-compact.sh
  - scripts/test-sdd-hook.sh
  - scripts/test-sdd-onboard.sh
  - scripts/test-sdd-preflight.sh
  - scripts/test-sdd-recall.sh
  - scripts/test-sdd-upgrade.sh
  - scripts/test-spec-check.sh
  - scripts/test-spec-sync.sh
  - scripts/test-spec-wireframe.sh

seeded:
  - .sdd/config.yml
  - .sdd/models.yml
  - AGENTS.md
  - README.md
  - docs/constitution.md
  # The wireframe kit and its notation are the product's, not the template's: a
  # starting point, developed here, and never overwritten by an upgrade.
  - docs/skills/drawing-wireframes/SKILL.md
  - docs/templates/wireframe.html

ignored:
  - CHANGELOG.md
  - LICENSE

# A block of the template living inside a file that belongs to the repository.
# `file marker` — the upgrade replaces what is between <!-- marker:start --> and
# <!-- marker:end -->, and touches nothing else in that file.
blocks:
  - AGENTS.md sdd:rule1
